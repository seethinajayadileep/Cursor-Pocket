[project]
name = "cursor-pocket"
version = "0.3.0"
description = "Android remote for Cursor desktop on your Mac."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
cursor-pocket = "cursor_pocket.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cursor_pocket*"]
